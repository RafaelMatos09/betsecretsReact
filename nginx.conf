server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API do Brasileirão (rota mais específica primeiro)
    location /api/campeonato/ {
        proxy_pass https://campeonatobrasileiroapi.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host campeonatobrasileiroapi.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend BetSecrets (login, usuários) — evita CORS em produção
    location /api/ {
        proxy_pass https://betsecretsc.onrender.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host betsecretsc.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
